version: '3.8'

services:
  # MariaDBデータベース
  db:
    image: mariadb:11
    container_name: quiz-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-quiz_app}
      MYSQL_USER: ${DATABASE_USER:-quizapp}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-passoword123}
      TZ: Asia/Tokyo
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nuxt アプリケーション（本番環境：フロントエンド + APIサーバー統合）
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: quiz-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DATABASE_USER:-quizapp}:${DATABASE_PASSWORD:-passoword123}@db:3306/${DATABASE_NAME:-quiz_app}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    networks:
      - quiz-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx リバースプロキシ（本番環境用）
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - quiz-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quiz-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  uploads:
    driver: local
  nginx_cache:
    driver: local
