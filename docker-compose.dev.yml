version: '3.8'

services:
  # MariaDBデータベース
  db:
    image: mariadb:11
    container_name: quiz-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-quiz_app}
      MYSQL_USER: ${DATABASE_USER:-quizapp}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-passoword123}
      TZ: Asia/Tokyo
    volumes:
      - mariadb_dev_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - quiz-network-dev
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nuxt 開発サーバー（フロントエンド + API）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: quiz-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${DATABASE_USER:-quizapp}:${DATABASE_PASSWORD:-passoword123}@db:3306/${DATABASE_NAME:-quiz_app}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${DEV_WS_PORT:-24678}:24678"  # Viteのホットリロード用WebSocketポート
    networks:
      - quiz-network-dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # ソースコードをマウント（ホットリロード用）
      - ./:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    stdin_open: true
    tty: true
    command: sh -c "npx prisma db push --skip-generate && npm run dev"

  # Nginx リバースプロキシ（オプション）
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quiz-network-dev
    depends_on:
      - app

networks:
  quiz-network-dev:
    driver: bridge

volumes:
  mariadb_dev_data:
    driver: local
